name: DVC Workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.dvc'
      - '.dvc/**'
  
jobs:
  run_data_checker:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Setup uv    
      uses: astral-sh/setup-uv@v7
      with:
        python-version: 3.12
        enable-cache: true # cache python packages so uv doesnt re-download on each run

    - name: Install dependencies
      run: |
        uv sync --dev --locked
    
    - name: Auth with GCP
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }} #TODO setup a repository secret in github with the key

    - name: Pull data
      run: |
        dvc pull --no-run-cache
      
    - name: Check data statistics
      run : |
        uv run src/mlops_proj/dataset.py